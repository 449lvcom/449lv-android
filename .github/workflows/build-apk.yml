name: Build 449LV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          cache-disabled: false

      - name: Build APKs (debug + release signed)
        run: |
          set +e
          gradle assembleDebug assembleRelease --stacktrace > /tmp/g.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            LINE=$(grep -n "error:" /tmp/g.log | head -1 | cut -d: -f1)
            if [ -n "$LINE" ] && [ "$LINE" != "0" ]; then
              ERR=$(sed -n "$((LINE-8)),$((LINE+24))p" /tmp/g.log | tr '\n' ' ')
            else
              grep -n -E "error:|e: |FAILED|Execution failed" /tmp/g.log | tail -20 | tr '\n' ' ' > /tmp/er.txt
              ERR="no error: match -> $(cat /tmp/er.txt) | tail: $(tail -c 600 /tmp/g.log | tr '\n' ' ')"
            fi
            echo "::error title=BUILD-ERROR::$ERR"
            exit $RC
          fi

      - name: Inspect & verify APK permissions (aapt)
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then echo "ERROR aapt not found"; exit 1; fi
          echo "aapt=$AAPT"
          OUT=apk-report.txt
          {
            echo "=== aapt dump permissions (release) ==="
            "$AAPT" dump permissions "$APK"
            echo ""
            echo "=== badging ==="
            "$AAPT" dump badging "$APK" | grep -E "^package:|uses-permission|targetSdkVersion|versionCode:" | head -40
            echo ""
            echo "=== SHA256 ==="
            sha256sum "$APK"
          } | tee "$OUT"
          for P in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.POST_NOTIFICATIONS android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_SPECIAL_USE android.permission.WAKE_LOCK android.permission.VIBRATE android.permission.RECEIVE_BOOT_COMPLETED; do
            if grep -q "$P" "$OUT"; then echo "OK    $P"; else echo "MISSING $P"; exit 1; fi
          done

      - name: Upload APK verification report
        uses: actions/upload-artifact@v4
        with:
          name: 449lv-apk-report
          path: apk-report.txt
          if-no-files-found: error

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/449lv-v2.9.apk
          cp app/build/outputs/apk/release/app-release.apk dist/449lv-latest.apk

      - name: Publish GitHub Release (v2.9)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9
          name: 449LV v2.9
          body: |
            إصدار 449LV v2.9 — يدخلك مباشرة للوحة المنيو

            • عند فتح التطبيق تظهر لوحة المنيو الخاصة بك مباشرة (بدل صفحة الهبوط)
            • إن لم تكن مسجلاً: تنتقل تلقائياً وداخل التطبيق لتسجيل الدخول بحساب Google ثم تعود للوحة — تُحفظ الجلسة ولا تُطلب مجدداً
            • التسجيل والخروج والجلسة تتم كلها داخل التطبيق دون الحاجة للمتصفح
          files: |
            dist/449lv-v2.9.apk
            dist/449lv-latest.apk
          overwrite: true
          fail_on_unmatched_files: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 449lv-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK (signed - لترقية مباشرة)
        uses: actions/upload-artifact@v4
        with:
          name: 449lv-apk-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
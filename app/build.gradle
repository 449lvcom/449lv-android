plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ak449lv.clientapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.ak449lv.clientapp"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}